name: Project quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check repository contents
        run: |
          test -s README.md
          test -s DEPLOYMENT.md
          test -f .gitignore
          echo "Repository documentation and ignore rules are present."
